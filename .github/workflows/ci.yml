name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: MangaCore unit tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
      - name: swift test
        working-directory: Packages/MangaCore
        run: swift test

  app:
    name: tvOS app build and UI tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Pick a tvOS simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          c=[(r,x) for r,v in d.items() if "tvOS" in r for x in v]
          c.sort(key=lambda t:(t[0], "4K" in t[1]["name"]))
          print(c[-1][1]["udid"])')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available | grep -i "apple tv" || true
      - name: Build and test
        run: |
          mkdir -p build
          status=0
          xcodebuild test \
            -project MangaReader.xcodeproj \
            -scheme MangaReader \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath build/Results.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            > build/xcodebuild.log 2>&1 || status=$?
          grep -E "error:|Test Case .*(passed|failed)|\*\* (BUILD|TEST)" build/xcodebuild.log | tail -300 || true
          if [ $status -ne 0 ]; then tail -80 build/xcodebuild.log; fi
          exit $status
      - name: Upload results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-results
          path: build/
