name: CI

# Pull requests run on pull_request only. Pushing to claude/** branches used
# to start a second, identical run for every PR push, which doubled the load
# on the few free macOS runners. main still runs on every merge.
#
# PRs run the UI smoke classes (tools/ui_smoke_tests.txt) plus the UI test
# files they change. Merges to main, the nightly run and manual runs
# (workflow_dispatch, any branch) run the full UI suite; a red one opens an
# issue. See docs/CI.md.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 8 * * *"   # 3 AM US Eastern
  workflow_dispatch:

# One run per PR (or branch). A new push cancels the PR's stale run.
# main is never cancelled, so every merge is fully tested.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Seconds on Linux: catches screen titles or headers that would stay pinned
  # over scrolling rows (see tools/check_pinned_headers.py).
  ui-lint:
    name: UI lint (pinned headers, design tokens)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/check_pinned_headers.py
      # Literal radii, fixed font sizes, off-table text styles, Section("…")
      # headers and "Retry" labels (see tools/check_design_tokens.py).
      - run: python3 tools/check_design_tokens.py
      # Every per-series reader setting has a global default.
      - run: python3 tools/check_setting_scopes.py
      # Settings apply as they change; only the server form has Save.
      - run: python3 tools/check_save_buttons.py
      # Settings are rows, not side-by-side chips; labels never wrap.
      - run: python3 tools/check_option_chips.py
      # Secure fields keep the system dots (see tools/check_secure_fields.py).
      - run: python3 tools/check_secure_fields.py

  core-tests:
    name: MangaCore unit tests
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
      - name: swift test
        working-directory: Packages/MangaCore
        run: swift test

  app:
    name: tvOS app build and UI tests
    runs-on: macos-15
    # The full UI suite took 52 minutes at 125 tests (run 372); the PR smoke
    # set about 18. Tests run one at a time on purpose: parallel simulator
    # clones made each test 2-5x slower on these 3-core runners (PR #42).
    # By 2026-11-26 it ran past 90 minutes (run 472, timed out in the last
    # classes), so the limit is 120. See docs/CI.md.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          # A PR checks out GitHub's merge commit; its first parent is the
          # base, so HEAD^1..HEAD is exactly the PR's change.
          fetch-depth: 2
      - name: Choose UI tests
        id: tests
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            only=$(python3 tools/select_ui_tests.py HEAD^1)
            echo "only=$only" >> "$GITHUB_OUTPUT"
          else
            echo "Full UI suite (${{ github.event_name }})"
          fi
      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build and test
        run: |
          mkdir -p build
          DD="$RUNNER_TEMP/DerivedData"
          # Listing simulators the first time starts CoreSimulator, which
          # takes 2-3 minutes on these runners. Do it while the app compiles.
          xcrun simctl list devices available -j > "$RUNNER_TEMP/sims.json" &
          sims_pid=$!
          # Stream results so a timed-out run still shows how far it got.
          set +e
          xcodebuild build-for-testing \
            -project MangaReader.xcodeproj \
            -scheme MangaReader \
            -destination 'generic/platform=tvOS Simulator' \
            -derivedDataPath "$DD" \
            ARCHS=arm64 CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build/build.log \
            | grep --line-buffered -E "error:|\*\* (BUILD|TEST)"
          status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then tail -80 build/build.log; exit $status; fi
          wait $sims_pid
          set -e
          UDID=$(python3 -c '
          import json,sys
          d=json.load(open(sys.argv[1]))["devices"]
          c=[(r,x) for r,v in d.items() if "tvOS" in r for x in v]
          c.sort(key=lambda t:(t[0], "4K" in t[1]["name"]))
          print(c[-1][1]["udid"])' "$RUNNER_TEMP/sims.json")
          echo "Simulator: $UDID"
          set +e
          xcodebuild test-without-building \
            -project MangaReader.xcodeproj \
            -scheme MangaReader \
            -destination "id=$UDID" \
            -derivedDataPath "$DD" \
            ${{ steps.tests.outputs.only }} \
            -resultBundlePath build/Results.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build/xcodebuild.log \
            | grep --line-buffered -iE "error:|Test Case .*(passed|failed)|\*\* (BUILD|TEST)"
          status=${PIPESTATUS[0]}
          set -e
          if [ $status -ne 0 ]; then tail -80 build/xcodebuild.log; fi
          exit $status
      - name: Upload results
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-results
          path: build/

  # A full run on main (merge, nightly or manual) that fails opens an issue,
  # or comments on the open one; the next green full run closes it. PRs only
  # run the smoke UI tests, so this is how a break in the rest gets seen.
  main-status:
    name: Report main status
    needs: [ui-lint, core-tests, app]
    if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        env:
          FAILED: ${{ contains(needs.*.result, 'failure') }}
        with:
          script: |
            const title = 'CI is red on main';
            const failed = process.env.FAILED === 'true';
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', creator: 'github-actions[bot]', per_page: 50,
            });
            const issue = open.find(i => i.title === title);
            const sha = context.sha.slice(0, 7);
            if (failed) {
              const body = `Full CI run failed on main at ${sha} (${context.eventName}): ${url}\n\nPRs run only the smoke UI tests, so check whether a recent merge broke a test outside \`tools/ui_smoke_tests.txt\`.`;
              if (issue) {
                await github.rest.issues.createComment({ ...context.repo, issue_number: issue.number, body });
              } else {
                await github.rest.issues.create({ ...context.repo, title, body });
              }
            } else if (issue) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: issue.number, body: `Green again at ${sha}: ${url}` });
              await github.rest.issues.update({ ...context.repo, issue_number: issue.number, state: 'closed' });
            }
