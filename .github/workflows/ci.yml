name: CI

# Pull requests run on pull_request only. Pushing to claude/** branches used
# to start a second, identical run for every PR push, which doubled the load
# on the few free macOS runners. main still runs on every merge.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run per PR (or branch). A new push cancels the PR's stale run.
# main is never cancelled, so every merge is fully tested.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Seconds on Linux: catches screen titles or headers that would stay pinned
  # over scrolling rows (see tools/check_pinned_headers.py).
  ui-lint:
    name: UI lint (pinned headers, design tokens)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/check_pinned_headers.py
      # Literal radii, fixed font sizes, off-table text styles, Section("…")
      # headers and "Retry" labels (see tools/check_design_tokens.py).
      - run: python3 tools/check_design_tokens.py
      # Every per-series reader setting has a global default.
      - run: python3 tools/check_setting_scopes.py

  core-tests:
    name: MangaCore unit tests
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
      - name: swift test
        working-directory: Packages/MangaCore
        run: swift test

  app:
    name: tvOS app build and UI tests
    runs-on: macos-15
    # The UI suite took 43 minutes at 91 tests. Tests run one at a time on
    # purpose: parallel simulator clones made each test 2-5x slower on these
    # 3-core runners and the job timed out (PR #42). See docs/CI.md.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build and test
        run: |
          mkdir -p build
          DD="$RUNNER_TEMP/DerivedData"
          # Listing simulators the first time starts CoreSimulator, which
          # takes 2-3 minutes on these runners. Do it while the app compiles.
          xcrun simctl list devices available -j > "$RUNNER_TEMP/sims.json" &
          sims_pid=$!
          # Stream results so a timed-out run still shows how far it got.
          set +e
          xcodebuild build-for-testing \
            -project MangaReader.xcodeproj \
            -scheme MangaReader \
            -destination 'generic/platform=tvOS Simulator' \
            -derivedDataPath "$DD" \
            ARCHS=arm64 CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build/build.log \
            | grep --line-buffered -E "error:|\*\* (BUILD|TEST)"
          status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then tail -80 build/build.log; exit $status; fi
          wait $sims_pid
          set -e
          UDID=$(python3 -c '
          import json,sys
          d=json.load(open(sys.argv[1]))["devices"]
          c=[(r,x) for r,v in d.items() if "tvOS" in r for x in v]
          c.sort(key=lambda t:(t[0], "4K" in t[1]["name"]))
          print(c[-1][1]["udid"])' "$RUNNER_TEMP/sims.json")
          echo "Simulator: $UDID"
          set +e
          xcodebuild test-without-building \
            -project MangaReader.xcodeproj \
            -scheme MangaReader \
            -destination "id=$UDID" \
            -derivedDataPath "$DD" \
            -resultBundlePath build/Results.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build/xcodebuild.log \
            | grep --line-buffered -iE "error:|Test Case .*(passed|failed)|\*\* (BUILD|TEST)"
          status=${PIPESTATUS[0]}
          set -e
          if [ $status -ne 0 ]; then tail -80 build/xcodebuild.log; fi
          exit $status
      - name: Upload results
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-results
          path: build/
