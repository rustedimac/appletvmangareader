name: MangaReader
options:
  bundleIdPrefix: com.rustedimac
  deploymentTarget:
    tvOS: "17.0"
  createIntermediateGroups: true
packages:
  MangaCore:
    path: Packages/MangaCore
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
targets:
  MangaReader:
    type: application
    platform: tvOS
    sources:
      - App/Sources
      - App/Resources
    dependencies:
      - package: MangaCore
      - target: MangaReaderTopShelf
    entitlements:
      path: App/MangaReader.entitlements
      properties:
        # Shared with the Top Shelf extension (TopShelfStore).
        com.apple.security.application-groups: [group.com.rustedimac.MangaReader]
        # Each Apple TV user is their own profile; servers are shared
        # through the user-independent keychain (see AppleTVUsers.swift).
        com.apple.developer.user-management: [runs-as-current-user-with-user-independent-keychain]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Manga Reader
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arm64]
        UIUserInterfaceStyle: Automatic
        GCSupportsControllerUserInteraction: true
        GCSupportedGameControllers:
          - ProfileName: ExtendedGamepad
          - ProfileName: MicroGamepad
        # Top Shelf items open mangareader://series and mangareader://read links.
        CFBundleURLTypes:
          - CFBundleURLName: com.rustedimac.MangaReader
            CFBundleURLSchemes: [mangareader]
        NSLocalNetworkUsageDescription: Manga Reader connects to your Kavita and Suwayomi servers on your local network.
        # Servers are plain HTTP on home hostnames (e.g. kavita.home). Don't add
        # NSAllowsLocalNetworking: when present, ATS ignores NSAllowsArbitraryLoads
        # and only exempts .local names and IP addresses.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rustedimac.MangaReader
        # App icon layers and Top Shelf images (tools/make_brand_assets.py).
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        TARGETED_DEVICE_FAMILY: "3"
        CODE_SIGN_STYLE: Automatic
  MangaReaderTopShelf:
    type: tv-app-extension
    platform: tvOS
    sources:
      - TopShelf
    dependencies:
      - package: MangaCore
      - sdk: TVServices.framework
    entitlements:
      path: App/TopShelf.entitlements
      properties:
        com.apple.security.application-groups: [group.com.rustedimac.MangaReader]
        com.apple.developer.user-management: [runs-as-current-user-with-user-independent-keychain]
    info:
      path: App/TopShelf-Info.plist
      properties:
        CFBundleDisplayName: Manga Reader
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.tv-top-shelf
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ContentProvider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rustedimac.MangaReader.TopShelf
        TARGETED_DEVICE_FAMILY: "3"
        CODE_SIGN_STYLE: Automatic
  MangaReaderUITests:
    type: bundle.ui-testing
    platform: tvOS
    sources:
      - App/UITests
    dependencies:
      - target: MangaReader
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rustedimac.MangaReaderUITests
        TARGETED_DEVICE_FAMILY: "3"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  MangaReader:
    build:
      targets:
        MangaReader: all
    test:
      targets:
        - MangaReaderUITests
