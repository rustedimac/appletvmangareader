name: MangaReader
options:
  bundleIdPrefix: com.rustedimac
  deploymentTarget:
    tvOS: "17.0"
  createIntermediateGroups: true
packages:
  MangaCore:
    path: Packages/MangaCore
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
targets:
  MangaReader:
    type: application
    platform: tvOS
    sources:
      - App/Sources
    dependencies:
      - package: MangaCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Manga Reader
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arm64]
        UIUserInterfaceStyle: Automatic
        GCSupportsControllerUserInteraction: true
        GCSupportedGameControllers:
          - ProfileName: ExtendedGamepad
          - ProfileName: MicroGamepad
        NSLocalNetworkUsageDescription: Manga Reader connects to your Kavita and Suwayomi servers on your local network.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rustedimac.MangaReader
        TARGETED_DEVICE_FAMILY: "3"
        CODE_SIGN_STYLE: Automatic
  MangaReaderUITests:
    type: bundle.ui-testing
    platform: tvOS
    sources:
      - App/UITests
    dependencies:
      - target: MangaReader
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rustedimac.MangaReaderUITests
        TARGETED_DEVICE_FAMILY: "3"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  MangaReader:
    build:
      targets:
        MangaReader: all
    test:
      targets:
        - MangaReaderUITests
