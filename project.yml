name: MangaReader
options:
  bundleIdPrefix: com.rustedimac
  deploymentTarget:
    tvOS: "17.0"
    iOS: "18.0"
  createIntermediateGroups: true
packages:
  MangaCore:
    path: Packages/MangaCore
  # App themes generated by Theme Lab; see Packages/Themes/README.md.
  CeladonTheme:
    path: Packages/Themes/CeladonTheme
  RisographTheme:
    path: Packages/Themes/RisographTheme
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
targets:
  MangaReader:
    type: application
    platform: tvOS
    sources:
      - App/Sources
      - App/Resources
    dependencies:
      - package: MangaCore
      - package: CeladonTheme
      - package: RisographTheme
      - target: MangaReaderTopShelf
    entitlements:
      path: App/MangaReader.entitlements
      properties:
        # Shared with the Top Shelf extension (TopShelfStore).
        com.apple.security.application-groups: [group.com.rustedimac.MangaReader]
        # Each Apple TV user is their own profile; servers are shared
        # through the user-independent keychain (see AppleTVUsers.swift).
        com.apple.developer.user-management: [runs-as-current-user-with-user-independent-keychain]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Manga Reader
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arm64]
        # Always dark: the app is designed dark, and following the system let
        # screens flip to light mid-edit (Add Server, 2026-11-25).
        UIUserInterfaceStyle: Dark
        # Heading faces for the Celadon and Risograph themes (SIL OFL,
        # licenses beside them in App/Resources/Fonts).
        UIAppFonts: [Alegreya-Bold.ttf, LondrinaSolid-Black.ttf]
        # iCloud sync turns on when this is an iCloud container id. Empty by
        # default so builds without a paid Apple Developer membership work;
        # see docs/ICLOUD.md.
        MRCloudKitContainer: $(MR_ICLOUD_CONTAINER)
        GCSupportsControllerUserInteraction: true
        GCSupportedGameControllers:
          - ProfileName: ExtendedGamepad
          - ProfileName: MicroGamepad
        # Top Shelf items open mangareader://series and mangareader://read links.
        CFBundleURLTypes:
          - CFBundleURLName: com.rustedimac.MangaReader
            CFBundleURLSchemes: [mangareader]
        NSLocalNetworkUsageDescription: Manga Reader connects to your Kavita and Suwayomi servers on your local network.
        # Servers are plain HTTP on home hostnames (e.g. kavita.home). Don't add
        # NSAllowsLocalNetworking: when present, ATS ignores NSAllowsArbitraryLoads
        # and only exempts .local names and IP addresses.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rustedimac.MangaReader
        # Set to iCloud.com.rustedimac.MangaReader once the iCloud capability
        # is enabled (docs/ICLOUD.md). Empty = sync off, nothing else changes.
        MR_ICLOUD_CONTAINER: ""
        # App icon layers and Top Shelf images (tools/make_brand_assets.py).
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        TARGETED_DEVICE_FAMILY: "3"
        CODE_SIGN_STYLE: Automatic
  # iPhone and iPad. Same sources as the tvOS app; platform differences are
  # `#if os(tvOS)` / `#if os(iOS)` in place. Same bundle id as the tvOS app
  # so one App Store record covers both (universal purchase).
  MangaReaderiOS:
    type: application
    platform: iOS
    sources:
      - App/Sources
      # The tvOS brand assets (icon layers, Top Shelf) stay out; the iOS
      # icon lives in App/Sources-iOS/Assets.xcassets.
      - path: App/Resources
        excludes: [Assets.xcassets]
      - App/Sources-iOS
    dependencies:
      - package: MangaCore
      - package: CeladonTheme
      - package: RisographTheme
    info:
      path: App/iOS-Info.plist
      properties:
        CFBundleDisplayName: Manga Reader
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: LaunchBackground
        # Follows the system light/dark setting (docs/IOS.md §1).
        UIAppFonts: [Alegreya-Bold.ttf, LondrinaSolid-Black.ttf]
        MRCloudKitContainer: $(MR_ICLOUD_CONTAINER)
        UIApplicationSupportsIndirectInputEvents: true
        # Split View and Slide Over on iPad.
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        ITSAppUsesNonExemptEncryption: false
        GCSupportsControllerUserInteraction: true
        GCSupportedGameControllers:
          - ProfileName: ExtendedGamepad
        CFBundleURLTypes:
          - CFBundleURLName: com.rustedimac.MangaReader
            CFBundleURLSchemes: [mangareader]
        NSLocalNetworkUsageDescription: Manga Reader connects to your Kavita and Suwayomi servers on your local network.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_NAME: MangaReader
        PRODUCT_BUNDLE_IDENTIFIER: com.rustedimac.MangaReader
        MR_ICLOUD_CONTAINER: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        CODE_SIGN_STYLE: Automatic
    # No entitlements: a free Personal Team profile can't hold App Groups or
    # iCloud, and the iOS app must install without the paid membership.
  MangaReaderiOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - App/UITests-iOS
    dependencies:
      - target: MangaReaderiOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rustedimac.MangaReaderiOSUITests
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
  MangaReaderTopShelf:
    type: tv-app-extension
    platform: tvOS
    sources:
      - TopShelf
    dependencies:
      - package: MangaCore
      - sdk: TVServices.framework
    entitlements:
      path: App/TopShelf.entitlements
      properties:
        com.apple.security.application-groups: [group.com.rustedimac.MangaReader]
        com.apple.developer.user-management: [runs-as-current-user-with-user-independent-keychain]
    info:
      path: App/TopShelf-Info.plist
      properties:
        CFBundleDisplayName: Manga Reader
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.tv-top-shelf
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ContentProvider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rustedimac.MangaReader.TopShelf
        TARGETED_DEVICE_FAMILY: "3"
        CODE_SIGN_STYLE: Automatic
  MangaReaderUITests:
    type: bundle.ui-testing
    platform: tvOS
    sources:
      - App/UITests
    dependencies:
      - target: MangaReader
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rustedimac.MangaReaderUITests
        TARGETED_DEVICE_FAMILY: "3"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  MangaReader:
    build:
      targets:
        MangaReader: all
    test:
      targets:
        - MangaReaderUITests
  MangaReaderiOS:
    build:
      targets:
        MangaReaderiOS: all
    test:
      targets:
        - MangaReaderiOSUITests
