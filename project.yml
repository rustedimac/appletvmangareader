name: MangaReader
options:
  bundleIdPrefix: com.rustedimac
  deploymentTarget:
    tvOS: "17.0"
  createIntermediateGroups: true
packages:
  MangaCore:
    path: Packages/MangaCore
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
targets:
  MangaReader:
    type: application
    platform: tvOS
    sources:
      - App/Sources
      - App/Resources
    dependencies:
      - package: MangaCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Manga Reader
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arm64]
        UIUserInterfaceStyle: Automatic
        # iCloud sync turns on when this is an iCloud container id. Empty by
        # default so builds without a paid Apple Developer membership work;
        # see docs/ICLOUD.md.
        MRCloudKitContainer: $(MR_ICLOUD_CONTAINER)
        GCSupportsControllerUserInteraction: true
        GCSupportedGameControllers:
          - ProfileName: ExtendedGamepad
          - ProfileName: MicroGamepad
        NSLocalNetworkUsageDescription: Manga Reader connects to your Kavita and Suwayomi servers on your local network.
        # Servers are plain HTTP on home hostnames (e.g. kavita.home). Don't add
        # NSAllowsLocalNetworking: when present, ATS ignores NSAllowsArbitraryLoads
        # and only exempts .local names and IP addresses.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rustedimac.MangaReader
        # Set to iCloud.com.rustedimac.MangaReader once the iCloud capability
        # is enabled (docs/ICLOUD.md). Empty = sync off, nothing else changes.
        MR_ICLOUD_CONTAINER: ""
        # App icon layers and Top Shelf images (tools/make_brand_assets.py).
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        TARGETED_DEVICE_FAMILY: "3"
        CODE_SIGN_STYLE: Automatic
  MangaReaderUITests:
    type: bundle.ui-testing
    platform: tvOS
    sources:
      - App/UITests
    dependencies:
      - target: MangaReader
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rustedimac.MangaReaderUITests
        TARGETED_DEVICE_FAMILY: "3"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  MangaReader:
    build:
      targets:
        MangaReader: all
    test:
      targets:
        - MangaReaderUITests
